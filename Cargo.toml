[package]
name = "hrtf"
version = "0.10.0"
authors = ["Dmitry Stepanov <d1maxa@yandex.ru>"]
edition = "2018"
license = "MIT"
description = "HRTF (Head-Related Transfer Function) audio signal processor"
keywords = ["sound", "hrtf", "binaural"]
repository = "https://github.com/mrDIMAS/hrtf"
include = ["/src/**/*", "/Cargo.toml", "/LICENSE", "/README.md", "/examples/*"]
documentation = "https://docs.rs/hrtf"
readme = "README.md"

[dependencies]
rubato = { version = "5.0.0", default-features = false }

[lints.rust]
# `nightly_bench` enables the `#[bench]` benchmarks in `benches/`, which need a nightly compiler.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(nightly_bench)"] }
